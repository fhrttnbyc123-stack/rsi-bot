name: RSI Smart Alert v2

on:
  schedule:
    - cron: '*/15 6-20 * * 1-5'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache signal history
        uses: actions/cache@v4
        with:
          path: signal_cache.json
          key: signals-${{ github.run_id }}
          restore-keys: signals-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Smart Alert
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python rsi_smart_alert_v2.py
